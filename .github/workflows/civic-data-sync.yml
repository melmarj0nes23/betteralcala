name: Civic Data Validation & Weekly Official Source Check

on:
  push:
    paths:
      - 'public/data/*.json'
  pull_request:
    paths:
      - 'public/data/*.json'
  schedule:
    # Weekly Monday 01:00 UTC (09:00 AM PHT)
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  validate-civic-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate public/data JSON schemas & source allowlist
        run: npm run validate:data

  check-official-sources:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check official pangasinan.gov.ph & PSGC sources (deterministic only)
        run: npm run seed:check -- --write-report

      - name: Upload candidate report artifact for human review
        uses: actions/upload-artifact@v4
        with:
          name: official-source-candidates
          path: public/data/seed-candidates-report.json

  sync-national-budget:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync BetterGov national GAA & FY27 NEP/HGAB data for Alcala
        run: npm run sync:budget

      - name: Open Pull Request if budget data changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(data): sync Alcala national budget & NEP/GAA records'
          branch: auto/sync-national-budget
          delete-branch: true
          title: 'chore(data): sync Alcala national budget & NEP/GAA records'
          body: |
            Automated weekly sync from `https://budget.bettergov.ph/api/v1` for **Alcala, Pangasinan**.
            Review the diff in `public/data/national-budget-alcala.json` and click **Merge pull request** to publish!
