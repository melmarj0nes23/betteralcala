name: Civic Data Validation & Weekly Official Source Check

on:
  push:
    paths:
      - 'public/data/*.json'
  pull_request:
    paths:
      - 'public/data/*.json'
  schedule:
    # Weekly Monday 01:00 UTC (09:00 AM PHT)
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  validate-civic-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate public/data JSON schemas & source allowlist
        run: npm run validate:data

  check-official-sources:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync official pangasinan.gov.ph & PSGC sources (deterministic only)
        run: npm run seed:check -- --apply --write-report

      - name: Validate civic datasets before committing
        run: npm run validate:data

      - name: Upload candidate report artifact for human review
        uses: actions/upload-artifact@v4
        with:
          name: official-source-candidates
          path: public/data/seed-candidates-report.json

      - name: Auto-commit & push to main if news or legislative data changed
        run: |
          if git diff --quiet public/data/news.json public/data/ordinances.json public/data/resolutions.json; then
            echo "No new news, ordinance, or resolution records detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json public/data/ordinances.json public/data/resolutions.json
          git commit -m "chore(data): auto-sync pangasinan.gov.ph news & legislative records"
          git pull --rebase origin main
          git push origin main

  sync-national-budget:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync BetterGov national GAA & FY27 NEP/HGAB data for Alcala
        run: npm run sync:budget

      - name: Validate civic datasets before committing
        run: npm run validate:data

      - name: Auto-commit & push to main if budget data changed
        run: |
          if git diff --quiet public/data/national-budget-alcala.json; then
            echo "No new budget or project changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/national-budget-alcala.json
          git commit -m "chore(data): auto-sync Alcala national budget & NEP/GAA records"
          git pull --rebase origin main
          git push origin main
